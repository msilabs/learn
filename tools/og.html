<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@500;700&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
    *{margin:0;box-sizing:border-box}
    html,body{width:1200px;height:630px;overflow:hidden}
    body{
        position:relative;display:grid;place-items:center;isolation:isolate;
        background:linear-gradient(140deg,#0B1324 0%,var(--c) 140%);
        font-family:'Inter','Noto Sans Bengali',sans-serif;color:#E9EEF8;
    }
    body::before{
        content:"";position:absolute;inset:0;z-index:-1;
        background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);
        background-size:40px 40px;
        mask-image:radial-gradient(circle at 50% 50%,#000,transparent 70%);
        -webkit-mask-image:radial-gradient(circle at 50% 50%,#000,transparent 70%);
    }
    .glow{position:absolute;width:420px;height:420px;border-radius:50%;background:var(--c);filter:blur(90px);opacity:.45;z-index:-1}
    .safe{width:760px;height:380px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
    .icon{font-size:130px;line-height:1;filter:drop-shadow(0 18px 40px rgba(0,0,0,.45))}
    .text{font-size:76px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
    .text.long{font-size:60px}
    .sub{font-family:'Noto Sans Bengali','Inter',sans-serif;font-size:32px;line-height:1.3;font-weight:500;color:rgba(233,238,248,.82)}
</style>
</head>
<body>
    <span class="glow"></span>
    <div class="safe">
        <div class="icon"></div>
        <div class="text"></div>
        <div class="sub"></div>
    </div>
<script>
    const q = new URLSearchParams(location.search);
    const colors = { mint: '#0FB58E', coral: '#E2553A', sun: '#E39A12', indigo: '#5B5FEF' };
    document.body.style.setProperty('--c', colors[q.get('color')] ?? colors.mint);
    document.querySelector('.icon').textContent = q.get('icon') ?? '';
    const text = q.get('text') ?? '';
    const textEl = document.querySelector('.text');
    textEl.textContent = text;
    textEl.classList.toggle('long', text.length > 14);
    document.querySelector('.sub').textContent = q.get('sub') ?? '';
</script>
</body>
</html>
